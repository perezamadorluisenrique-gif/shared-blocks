# Builds the release assets and opens a draft release.
#
# Start it from Actions -> Release -> Run workflow, giving the version as the
# tag. That is the only trigger, on purpose. It used to run on a tag push as
# well, but publishing the draft is what creates the tag, so that trigger fired
# this same workflow again and left a duplicate draft behind after every
# release.
#
# The tag must equal `version` in manifest.json, with no `v` prefix. The job
# checks that before building and fails loudly if it drifts, because the
# community directory reads the two together and a mismatch is only caught
# after submission.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, exactly as manifest.json has it (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  # Both are required by actions/attest-build-provenance.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 and no lower: the tests run `node --test` straight on .ts files.
          node-version: '22'

      - name: Check the tag against manifest.json and versions.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag '$TAG' does not match manifest.json version '$VERSION'." >&2
            exit 1
          fi
          node -e "
            const versions = require('./versions.json');
            const manifest = require('./manifest.json');
            const mapped = versions[manifest.version];
            if (!mapped) {
              console.error('versions.json has no entry for ' + manifest.version + '.');
              process.exit(1);
            }
            if (mapped !== manifest.minAppVersion) {
              console.error('versions.json maps ' + manifest.version + ' to ' + mapped +
                ', but minAppVersion is ' + manifest.minAppVersion + '.');
              process.exit(1);
            }
          "

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # A release with no description is a finding in Obsidian's plugin
      # review, so the notes come from CHANGELOG.md and a missing section
      # stops the release rather than shipping an empty one.
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="## $TAG" '
            $0 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## $TAG' section to use as release notes." >&2
            exit 1
          fi
          cat release-notes.md

      # Lets anyone verify with `gh attestation verify` that these files were
      # built by this workflow from this repository.
      - name: Attest the build provenance of the release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --target "${{ github.sha }}" \
            --notes-file release-notes.md \
            --draft \
            main.js manifest.json styles.css
