# Builds the release assets and opens a draft release.
#
# Two ways to start it:
#   - push a tag, e.g. `git tag 0.1.0 && git push origin 0.1.0`
#   - Actions -> Release -> Run workflow, giving the version as the tag
#
# Either way the tag must equal `version` in manifest.json, with no `v`
# prefix. The job checks that before building and fails loudly if it drifts,
# because the community directory reads the two together and a mismatch is
# only caught after submission.
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, exactly as manifest.json has it (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 and no lower: the tests run `node --test` straight on .ts files.
          node-version: '22'

      - name: Check the tag against manifest.json and versions.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag '$TAG' does not match manifest.json version '$VERSION'." >&2
            exit 1
          fi
          node -e "
            const versions = require('./versions.json');
            const manifest = require('./manifest.json');
            const mapped = versions[manifest.version];
            if (!mapped) {
              console.error('versions.json has no entry for ' + manifest.version + '.');
              process.exit(1);
            }
            if (mapped !== manifest.minAppVersion) {
              console.error('versions.json maps ' + manifest.version + ' to ' + mapped +
                ', but minAppVersion is ' + manifest.minAppVersion + '.');
              process.exit(1);
            }
          "

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --target "${{ github.sha }}" \
            --draft \
            main.js manifest.json styles.css
